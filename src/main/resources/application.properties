spring.application.name=auth
spring.config.import=optional:file:.env

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.database.username=${POSTGRES_USER}
spring.database.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=none  # because migrations are handled by Flyway
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.address=${APP_HOST}
server.port=${APP_PORT:5000}

spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration